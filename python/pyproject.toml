[project]
name = "gated-template"
version = "0.1.0"
description = "A repository template whose pull requests cannot merge unless four checks pass."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.14.2", "pytest==9.0.3", "import-linter==2.3", "pip-audit==2.9.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "ARG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
