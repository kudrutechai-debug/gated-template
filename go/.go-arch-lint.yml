version: 3
workdir: .

components:
  domain:
    in: internal/domain
  adapter:
    in: internal/adapter
  handler:
    in: internal/handler
  cmd:
    in: cmd/**

deps:
  # The point of the whole file: domain may depend on nothing, which
  # go-arch-lint expresses by leaving it out of deps entirely. An empty
  # mayDependOn: [] is a config error, not a rule.
  adapter:
    mayDependOn:
      - domain
  handler:
    mayDependOn:
      - adapter
      - domain
  cmd:
    mayDependOn:
      - handler
      - adapter
      - domain
